<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Difficult Conversations — Douglas Stone, Bruce Patton and Sheila Heen</title><desc id="desc">A layered map separating the what happened, feelings, and identity conversations before moving toward learning and action.</desc>
<rect width="1200" height="1600" fill="#1f1e1c"/><rect x="70" y="70" width="1060" height="1460" rx="42" fill="#f3eee6"/>
<text x="120" y="155" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#c96f4a">BEHAVIOR SCHOOL · COMMUNICATION</text>
<text x="120" y="255" font-family="Arial,sans-serif" font-size="67" font-weight="800" fill="#242220">DIFFICULT</text><text x="120" y="330" font-family="Arial,sans-serif" font-size="67" font-weight="800" fill="#c96f4a">CONVERSATIONS</text>
<text x="120" y="400" font-family="Arial,sans-serif" font-size="25" fill="#57524d">Douglas Stone · Bruce Patton · Sheila Heen</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="140" y="540" width="920" height="125" rx="24" fill="#ead6cb"/><text x="600" y="600" font-size="25" font-weight="700">WHAT HAPPENED?</text><text x="600" y="632" font-size="18">facts · perspectives · intentions · contribution</text>
<rect x="140" y="715" width="920" height="125" rx="24" fill="#ead6cb"/><text x="600" y="775" font-size="25" font-weight="700">FEELINGS</text><text x="600" y="807" font-size="18">emotion · impact · expression</text>
<rect x="140" y="890" width="920" height="125" rx="24" fill="#c96f4a"/><text x="600" y="950" font-size="25" font-weight="700" fill="#fff">IDENTITY</text><text x="600" y="982" font-size="18" fill="#fff">What does this seem to say about me?</text>
<path d="M600 665v50M600 840v50" stroke="#c96f4a" stroke-width="8"/>
<rect x="250" y="1090" width="700" height="170" rx="28" fill="#242220"/><text x="600" y="1150" font-size="27" font-weight="700" fill="#f3eee6">LEARNING MAP</text><text x="600" y="1200" font-size="21" fill="#f3eee6">perspectives → contribution → learning → next action</text>
</g>
<text x="120" y="1340" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#c96f4a">MENTAL MODEL</text><text x="120" y="1390" font-family="Arial,sans-serif" font-size="24" fill="#242220">Separate the layers so one disagreement does not become a verdict on identity.</text>
</svg>