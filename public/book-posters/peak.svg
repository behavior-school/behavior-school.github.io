<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Peak expertise poster</title><desc id="desc">A mountain path maps specific goals to focused practice, feedback, mental representations, and harder variations.</desc><rect width="1200" height="1600" fill="#171717"/><text x="90" y="150" fill="#d97757" font-family="Arial,sans-serif" font-size="34" font-weight="700">BEHAVIOR SCHOOL · EXPERTISE</text><text x="90" y="260" fill="#f5f1ea" font-family="Arial,sans-serif" font-size="84" font-weight="800">Peak</text><text x="90" y="325" fill="#bdb8ae" font-family="Arial,sans-serif" font-size="31">Anders Ericsson &amp; Robert Pool · 2016</text><path d="M130 1080 L340 820 L500 930 L700 610 L880 760 L1060 420" fill="none" stroke="#d97757" stroke-width="22"/><g fill="#f5f1ea" stroke="#d97757" stroke-width="6"><circle cx="130" cy="1080" r="42"/><circle cx="340" cy="820" r="42"/><circle cx="500" cy="930" r="42"/><circle cx="700" cy="610" r="42"/><circle cx="880" cy="760" r="42"/><circle cx="1060" cy="420" r="42"/></g><g fill="#f5f1ea" font-family="Arial,sans-serif" font-size="26" font-weight="700"><text x="95" y="1160">TARGET</text><text x="275" y="760">FOCUS</text><text x="430" y="1010">FEEDBACK</text><text x="650" y="550">REPRESENT</text><text x="825" y="840">VARY</text><text x="1010" y="350">IMPROVE</text></g><text x="90" y="1270" fill="#f5f1ea" font-family="Arial,sans-serif" font-size="40" font-weight="700">Practice is information, not just time.</text><text x="90" y="1340" fill="#bdb8ae" font-family="Arial,sans-serif" font-size="28">Isolate the bottleneck. Get feedback. Change the next task.</text></svg>