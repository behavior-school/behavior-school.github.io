<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Stumbling on Happiness — Daniel Gilbert</title>
<desc id="desc">A forecasting loop showing current preferences, imagined futures, selective simulation, real experience, adaptation, and forecast updating.</desc>
<rect width="1200" height="1600" rx="48" fill="#171717"/>
<circle cx="600" cy="820" r="340" fill="none" stroke="#e98561" stroke-width="10"/>
<g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle"><g fill="#262626" stroke="#e98561" stroke-width="5"><circle cx="600" cy="450" r="82"/><circle cx="900" cy="650" r="82"/><circle cx="820" cy="1030" r="82"/><circle cx="380" cy="1030" r="82"/><circle cx="300" cy="650" r="82"/></g><g fill="#f4f0ea" font-size="24"><text x="600" y="445">IMAGINE</text><text x="600" y="475">FUTURE</text><text x="900" y="645">FORECAST</text><text x="900" y="675">FEELING</text><text x="820" y="1025">REAL</text><text x="820" y="1055">EXPERIENCE</text><text x="380" y="1025">ADAPT +</text><text x="380" y="1055">CONTEXT</text><text x="300" y="645">UPDATE</text><text x="300" y="675">MODEL</text></g></g>
<text x="100" y="145" fill="#e98561" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">BEHAVIOR SCHOOL · PSYCHOLOGY</text>
<text x="100" y="250" fill="#f4f0ea" font-family="Arial, sans-serif" font-size="70" font-weight="800">STUMBLING ON</text>
<text x="100" y="325" fill="#f4f0ea" font-family="Arial, sans-serif" font-size="70" font-weight="800">HAPPINESS</text>
<text x="100" y="380" fill="#bcb7af" font-family="Arial, sans-serif" font-size="30">Daniel Gilbert · 2006</text>
<rect x="100" y="1320" width="1000" height="150" rx="28" fill="#262626" stroke="#3b3b3b"/>
<text x="145" y="1380" fill="#e98561" font-family="Arial, sans-serif" font-size="25" font-weight="700">BEHAVIORAL FORMULA</text>
<text x="145" y="1430" fill="#f4f0ea" font-family="Arial, sans-serif" font-size="31">Imagine → predict → experience → compare → update</text>
</svg>
