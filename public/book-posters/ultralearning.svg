<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Ultralearning project poster</title><desc id="desc">A circular project map connects target performance, metalearning, direct practice, gaps, drills, feedback, and transfer.</desc><rect width="1200" height="1600" fill="#171717"/><text x="90" y="150" fill="#d97757" font-family="Arial,sans-serif" font-size="34" font-weight="700">BEHAVIOR SCHOOL · SELF-DIRECTED LEARNING</text><text x="90" y="260" fill="#f5f1ea" font-family="Arial,sans-serif" font-size="78" font-weight="800">Ultralearning</text><text x="90" y="325" fill="#bdb8ae" font-family="Arial,sans-serif" font-size="31">Scott H. Young · 2019</text><g fill="none" stroke="#d97757" stroke-width="9"><circle cx="600" cy="760" r="280"/><path d="M600 480 L760 560 L860 720 L790 900 L600 1040 L400 940 L330 760 L430 570 Z"/></g><g fill="#f5f1ea" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle"><text x="600" y="520">TARGET</text><text x="770" y="600">MAP</text><text x="820" y="755">DIRECT</text><text x="750" y="900">GAPS</text><text x="600" y="980">DRILL</text><text x="420" y="920">FEEDBACK</text><text x="380" y="760">TRANSFER</text><text x="455" y="600">REPEAT</text></g><text x="90" y="1230" fill="#f5f1ea" font-family="Arial,sans-serif" font-size="40" font-weight="700">Let performance write the syllabus.</text><text x="90" y="1300" fill="#d97757" font-family="Arial,sans-serif" font-size="39" font-weight="700">Do → expose gaps → study → drill → test again.</text></svg>