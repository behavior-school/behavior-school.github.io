<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Range — David Epstein</title>
<desc id="desc">A visual map showing sampling, comparison, transfer, fit, specialization, and adaptive expertise as a widening-to-narrowing path.</desc>
<rect width="1200" height="1600" rx="48" fill="#171717"/>
<path d="M160 1120 C260 760 420 500 600 390 C780 280 940 250 1040 170" fill="none" stroke="#e98561" stroke-width="70" stroke-linecap="round" opacity=".18"/>
<path d="M160 1120 C260 760 420 500 600 390 C780 280 940 250 1040 170" fill="none" stroke="#e98561" stroke-width="10" stroke-linecap="round"/>
<text x="100" y="140" fill="#e98561" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="5">BEHAVIOR SCHOOL · LEARNING</text>
<text x="100" y="245" fill="#f4f0ea" font-family="Arial, sans-serif" font-size="92" font-weight="800">RANGE</text>
<text x="100" y="305" fill="#bcb7af" font-family="Arial, sans-serif" font-size="30">David Epstein · 2019</text>
<g font-family="Arial, sans-serif" font-weight="700" fill="#f4f0ea">
<text x="135" y="1240" font-size="34">1 · SAMPLE</text><text x="360" y="900" font-size="34">2 · COMPARE</text><text x="570" y="650" font-size="34">3 · TRANSFER</text><text x="770" y="500" font-size="34">4 · FIT</text><text x="905" y="350" font-size="34">5 · DEPTH</text>
</g>
<g fill="#e98561"><circle cx="160" cy="1120" r="20"/><circle cx="380" cy="850" r="20"/><circle cx="600" cy="570" r="20"/><circle cx="800" cy="430" r="20"/><circle cx="1030" cy="180" r="20"/></g>
<rect x="100" y="1320" width="1000" height="150" rx="28" fill="#262626" stroke="#3b3b3b"/>
<text x="145" y="1380" fill="#e98561" font-family="Arial, sans-serif" font-size="25" font-weight="700">BEHAVIORAL FORMULA</text>
<text x="145" y="1430" fill="#f4f0ea" font-family="Arial, sans-serif" font-size="31">Breadth → comparison → transfer → informed depth</text>
