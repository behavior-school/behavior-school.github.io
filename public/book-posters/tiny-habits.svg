<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Tiny Habits behavioral design poster</title><desc id="desc">A seed-to-tree visual map showing prompt, tiny action, successful repetition, positive emotion, and growth.</desc><rect width="1200" height="1600" fill="#171717"/><circle cx="930" cy="240" r="180" fill="#d97757" opacity=".18"/><text x="90" y="150" fill="#d97757" font-family="Arial,sans-serif" font-size="34" font-weight="700">BEHAVIOR SCHOOL · HABITS</text><text x="90" y="260" fill="#f5f1ea" font-family="Arial,sans-serif" font-size="86" font-weight="800">Tiny Habits</text><text x="90" y="320" fill="#bdb8ae" font-family="Arial,sans-serif" font-size="32">B. J. Fogg · 2019</text><g stroke="#d97757" stroke-width="8" fill="none"><path d="M160 610 C300 500 390 700 520 590 S760 500 900 610"/><path d="M900 610 C1010 700 940 830 790 870"/><path d="M790 870 C610 950 510 820 390 930"/></g><g fill="#f5f1ea"><circle cx="160" cy="610" r="48"/><circle cx="520" cy="590" r="48"/><circle cx="900" cy="610" r="48"/><circle cx="790" cy="870" r="48"/><circle cx="390" cy="930" r="48"/></g><g fill="#171717" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle"><text x="160" y="618">PROMPT</text><text x="520" y="598">TINY</text><text x="900" y="618">SUCCESS</text><text x="790" y="878">EMOTION</text><text x="390" y="938">GROW</text></g><text x="90" y="1160" fill="#f5f1ea" font-family="Arial,sans-serif" font-size="42" font-weight="700">Behavioral formula</text><text x="90" y="1230" fill="#d97757" font-family="Arial,sans-serif" font-size="46" font-weight="700">Reliable prompt + easy action + visible success</text><text x="90" y="1340" fill="#bdb8ae" font-family="Arial,sans-serif" font-size="28">Shrink the starting behavior until it fits real life.</text><text x="90" y="1390" fill="#bdb8ae" font-family="Arial,sans-serif" font-size="28">Then grow only when repetition is stable.</text></svg>