<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Make It Stick learning science poster</title><desc id="desc">A retrieval ladder shows study, forgetting, retrieval, feedback, spacing, and transfer.</desc><rect width="1200" height="1600" fill="#171717"/><text x="90" y="150" fill="#d97757" font-family="Arial,sans-serif" font-size="34" font-weight="700">BEHAVIOR SCHOOL · LEARNING</text><text x="90" y="260" fill="#f5f1ea" font-family="Arial,sans-serif" font-size="78" font-weight="800">Make It Stick</text><text x="90" y="325" fill="#bdb8ae" font-family="Arial,sans-serif" font-size="31">Brown · Roediger · McDaniel · 2014</text><g stroke="#d97757" stroke-width="8" fill="none"><path d="M170 570 L340 700 L510 570 L680 700 L850 570 L1030 700"/></g><g fill="#f5f1ea"><circle cx="170" cy="570" r="44"/><circle cx="340" cy="700" r="44"/><circle cx="510" cy="570" r="44"/><circle cx="680" cy="700" r="44"/><circle cx="850" cy="570" r="44"/><circle cx="1030" cy="700" r="44"/></g><g fill="#171717" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><text x="170" y="578">STUDY</text><text x="340" y="708">FORGET</text><text x="510" y="578">RETRIEVE</text><text x="680" y="708">CHECK</text><text x="850" y="578">SPACE</text><text x="1030" y="708">TRANSFER</text></g><text x="90" y="1010" fill="#f5f1ea" font-family="Arial,sans-serif" font-size="42" font-weight="700">The test of learning</text><text x="90" y="1080" fill="#d97757" font-family="Arial,sans-serif" font-size="44" font-weight="700">Can you reconstruct it without the source?</text><text x="90" y="1210" fill="#bdb8ae" font-family="Arial,sans-serif" font-size="28">Familiarity is a clue. Retrieval is stronger evidence.</text><text x="90" y="1260" fill="#bdb8ae" font-family="Arial,sans-serif" font-size="28">Use feedback to repair the model, then return later.</text></svg>