<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">The Power of Moments behavioral design poster</title><desc id="desc">Four connected nodes show elevation, insight, pride, and connection converging on a defining moment.</desc><rect width="1200" height="1600" fill="#171717"/><text x="90" y="150" fill="#d97757" font-family="Arial,sans-serif" font-size="34" font-weight="700">BEHAVIOR SCHOOL · EXPERIENCE DESIGN</text><text x="90" y="260" fill="#f5f1ea" font-family="Arial,sans-serif" font-size="72" font-weight="800">The Power</text><text x="90" y="340" fill="#f5f1ea" font-family="Arial,sans-serif" font-size="72" font-weight="800">of Moments</text><text x="90" y="400" fill="#bdb8ae" font-family="Arial,sans-serif" font-size="32">Chip Heath &amp; Dan Heath · 2017</text><g stroke="#d97757" stroke-width="7" fill="none"><path d="M600 720 L280 570"/><path d="M600 720 L920 570"/><path d="M600 720 L280 900"/><path d="M600 720 L920 900"/></g><g fill="#f5f1ea" stroke="#d97757" stroke-width="6"><circle cx="280" cy="570" r="90"/><circle cx="920" cy="570" r="90"/><circle cx="280" cy="900" r="90"/><circle cx="920" cy="900" r="90"/><circle cx="600" cy="720" r="120"/></g><g fill="#171717" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle"><text x="280" y="578">ELEVATION</text><text x="920" y="578">INSIGHT</text><text x="280" y="908">PRIDE</text><text x="920" y="908">CONNECTION</text><text x="600" y="712">DEFINING</text><text x="600" y="750">MOMENT</text></g><text x="90" y="1190" fill="#f5f1ea" font-family="Arial,sans-serif" font-size="40" font-weight="700">Design for contrast, attention and meaning</text><text x="90" y="1260" fill="#d97757" font-family="Arial,sans-serif" font-size="38" font-weight="700">Not constant intensity.</text><text x="90" y="1340" fill="#bdb8ae" font-family="Arial,sans-serif" font-size="28">A meaningful peak can be small when the baseline is ordinary.</text></svg>